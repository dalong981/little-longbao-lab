<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>微信公众号封面图 · 2.35:1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    /* WeChat Cover Standard Size: 900x383 (2.35:1) */
    .cover-canvas {
      width: 900px;
      height: 383px;
      position: relative;
      overflow: hidden;
      display: flex;
      background: #0b0f19;
    }
    /* Right Photo Layer */
    .cover-photo {
      position: absolute;
      right: 0;
      top: 0;
      width: 550px;
      height: 100%;
      background: url('images/IMG_4455.jpg') center center / cover no-repeat;
    }
    /* Gradient Overlay on Left to blend with text */
    .cover-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #0b0f19 0%, #0b0f19 38%, rgba(11, 15, 25, 0.85) 60%, rgba(11, 15, 25, 0.25) 100%);
      z-index: 2;
    }
    /* Content on Left */
    .cover-content {
      position: relative;
      z-index: 3;
      padding: 44px 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 620px;
      height: 100%;
    }
    .cover-top-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 107, 53, 0.25);
      border: 1px solid rgba(255, 107, 53, 0.6);
      color: #ff8c5a;
      font-size: 13px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      width: fit-content;
      letter-spacing: 0.5px;
    }
    .cover-main-title {
      font-size: 34px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.25;
      letter-spacing: -0.5px;
      margin-top: 10px;
      margin-bottom: 10px;
    }
    .cover-main-title span {
      background: linear-gradient(135deg, #ff6b35, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .cover-subtitle {
      font-size: 15px;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .cover-footer {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: auto;
    }
    .cover-author-pill {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f1f5f9;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 8px;
    }
    .cover-cost-pill {
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="cover-canvas" id="wechatCover">
    <div class="cover-photo"></div>
    <div class="cover-gradient"></div>
    <div class="cover-content">
      <div>
        <div class="cover-top-tag">🧪 小龙包的厨房物理实验室 · 第 01 期</div>
        <h1 class="cover-main-title">
          想让孩子成为下一个马斯克？<br>
          先从<span>这根棉签</span>与<span>一碗牛奶</span>开始
        </h1>
        <p class="cover-subtitle">
          成本不到 10 块钱，却在餐桌上炸出了意料之外的专注力与自主性
        </p>
      </div>

      <div class="cover-footer">
        <span class="cover-author-pill">公众号 · 小龙包爸爸</span>
        <span class="cover-cost-pill">💰 耗费：7元色素 + 半盒牛奶 + 1根棉签</span>
      </div>
    </div>
  </div>
</body>
</html>
